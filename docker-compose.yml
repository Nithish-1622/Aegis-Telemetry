services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:19092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aegis_runtime
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  telemetry-bootstrap:
    build:
      context: .
      dockerfile: docker/Dockerfile.bootstrap
    depends_on:
      - kafka
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      AEGIS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      AEGIS_RUNTIME_SERVICE_NAME: telemetry-bootstrap
      AEGIS_RUNTIME_ENVIRONMENT: docker

  gateway-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo-service
      args:
        MODULE_NAME: gateway-service
    depends_on:
      - telemetry-bootstrap
      - order-service
    ports:
      - "8081:8080"
    environment:
      AEGIS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ORDER_SERVICE_URL: http://order-service:8081

  order-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo-service
      args:
        MODULE_NAME: order-service
    depends_on:
      - payment-service
      - inventory-service
    ports:
      - "8082:8081"
    environment:
      AEGIS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      PAYMENT_SERVICE_URL: http://payment-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083

  payment-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo-service
      args:
        MODULE_NAME: payment-service
    depends_on:
      - kafka
    ports:
      - "8083:8082"
    environment:
      AEGIS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092

  inventory-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo-service
      args:
        MODULE_NAME: inventory-service
    depends_on:
      - kafka
    ports:
      - "8084:8083"
    environment:
      AEGIS_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
